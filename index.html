<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c12">
<link rel="manifest" href="manifest.webmanifest">
<title>Peak Fitness</title>
<style>
:root{--bg:#090c12;--surface:#111722;--surface2:#171f2d;--line:#263246;--text:#f5f7fb;--muted:#94a0b3;--accent:#61b8f2;--green:#71d89c;--warn:#f0bd72;--danger:#ef7d83;--pink:#dc7ab0}
*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{padding-bottom:105px}.app{max-width:760px;margin:auto;padding:20px 12px 28px}.header{display:flex;align-items:center;gap:14px;padding:7px 4px 22px}.logo{width:58px;height:58px;border-radius:18px;object-fit:cover}.brand{font-size:27px;font-weight:900;letter-spacing:-.6px}.kicker{font-size:13px;color:var(--muted);margin-top:2px}
.section{display:none}.section.active{display:block}.card{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:14px;margin-bottom:10px;overflow:hidden}.hero{padding:17px}.title{font-size:18px;font-weight:850}.big{font-size:29px;font-weight:900;letter-spacing:-.5px;margin-top:6px}.sub{font-size:12px;color:var(--muted);line-height:1.45}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}.row>*{min-width:0}
button,input,select,textarea{font:inherit}button{cursor:pointer}.primary,.secondary,.mini,.planBtn,.navbtn,.check{border:0}.primary,.secondary{width:100%;border-radius:13px;padding:12px 13px;font-weight:800}.primary{background:var(--accent);color:#061018}.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.mini{padding:7px 9px;border-radius:9px;background:var(--surface2);color:var(--text);border:1px solid var(--line);font-size:11px;font-weight:750}
.badge{display:inline-flex;align-items:center;justify-content:center;padding:6px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:10px;color:var(--muted);white-space:nowrap}.badge.T{background:rgba(220,122,176,.15);color:#f2afd0}.badge.N{background:rgba(97,184,242,.15);color:#a9d9fa}.badge.F{background:rgba(113,216,156,.12);color:#a9e9c2}.badge.U{background:rgba(240,189,114,.13);color:#ffd9a0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.trackBox{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:10px}.trackBox label,label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.trackBox input,input,select,textarea{width:100%;min-width:0;background:#0d121b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;outline:none}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}.quick button{background:var(--surface2);border:1px solid var(--line);border-radius:13px;color:var(--text);padding:10px;text-align:left}.quick b{display:block;font-size:12px}.quick span{font-size:10px;color:var(--muted)}
.metric{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}.metric:last-child{border:0}.metric>span:first-child{min-width:0;flex:1}.metric strong{font-size:12px;text-align:right}
.good,.alert{padding:10px;border-radius:12px;font-size:11px;line-height:1.45;margin-top:8px}.good{background:rgba(113,216,156,.08);border:1px solid rgba(113,216,156,.25);color:#b9efce}.alert{background:rgba(240,189,114,.08);border:1px solid rgba(240,189,114,.28);color:#ffe0b0}
.mobRow{display:grid;grid-template-columns:34px minmax(0,1fr) 55px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.check{width:30px;height:30px;border-radius:9px;background:var(--surface2);color:var(--text);border:1px solid var(--line)}.check.on{background:var(--green);color:#07140d}
.planBtn{display:block;width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;text-align:left}.editCard{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:8px}
.exercise{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:12px;margin-bottom:9px}.exerciseHead{display:flex;gap:10px;align-items:flex-start}.exerciseIcon{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#223147,#10151d);border:1px solid #2b3a52;font-size:24px;flex:0 0 50px}.exerciseInfo{min-width:0;flex:1}.exName{font-weight:850}.liveActions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.setHead,.setRow{display:grid;grid-template-columns:25px minmax(0,1fr) minmax(0,1fr) 52px 37px;gap:5px;align-items:center;margin-top:6px}.setHead{font-size:9px;color:var(--muted)}.setRow input,.setRow select{padding:8px 5px}.doneBtn{height:35px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--text)}.doneBtn.on{background:var(--green);color:#07140d}
.timer{font-size:24px;font-weight:900}.progress{height:7px;border-radius:99px;background:#0a0e15;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:var(--accent)}
.calendarHeader{display:flex;align-items:center;justify-content:space-between}.calGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}.dow{text-align:center;font-size:9px;color:var(--muted);padding:4px}.day{min-width:0;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:5px 3px;background:var(--surface2);overflow:hidden}.day.sel{outline:2px solid var(--accent)}.dayNum{font-size:11px;font-weight:800}.tiny{display:block;font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.tiny.strength{color:#c9eaff}.tiny.cardio{color:#f6b9d7}.tiny.mobility{color:#b8ebc9}
.scoreGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.score{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:10px}.score b{display:block;font-size:21px}.score span{font-size:10px;color:var(--muted)}
.dayHistory{display:flex;gap:6px;overflow:auto;padding-bottom:2px;margin-top:11px}.dayChip{flex:0 0 auto;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:8px;font-size:10px}.dayChip.active{outline:2px solid var(--accent)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:rgba(9,12,18,.97);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 7px calc(8px + env(safe-area-inset-bottom));z-index:50}.bottominner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.navbtn{min-width:0;min-height:58px;border-radius:13px;background:transparent;color:var(--muted);font-size:10px;font-weight:800}.navbtn.active{background:rgba(97,184,242,.09);color:var(--accent)}.ico{display:block;font-size:21px;margin-bottom:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
.setup{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;padding:30px 14px;overflow:auto}.setup.show{display:block}.setupBox{max-width:560px;margin:40px auto}
@media(max-width:370px){.grid2,.scoreGrid{grid-template-columns:1fr}.app{padding-left:8px;padding-right:8px}.day{min-height:60px}.tiny{font-size:6px}}
</style>
</head>
<body>
<div id="setup" class="setup"><div class="setupBox"><div class="big">🔐 Privates Setup</div><div class="sub">Trainingspläne und Schichtrhythmus liegen nur lokal. Importiere deine private JSON-Datei.</div><div class="card" style="margin-top:18px"><button class="primary" onclick="importPrivateSetup()">Private Setup-Datei importieren</button><div class="sub" style="margin-top:8px">Nicht auf GitHub hochladen.</div></div></div></div>
<div class="app">
 <header class="header"><img class="logo" src="icon-192.png"><div><div class="brand">Peak Fitness</div><div class="kicker">Hypertrophy-first Hybrid · v11.1</div></div></header>
 <section id="home" class="section active"></section>
 <section id="workout" class="section"></section>
 <section id="calendar" class="section"></section>
 <section id="progressPage" class="section"></section>
 <section id="coach" class="section"></section>
</div>
<nav class="bottomnav"><div class="bottominner">
 <button class="navbtn active" data-page="home"><span class="ico">⌂</span>Heute</button>
 <button class="navbtn" data-page="workout"><span class="ico">●</span>Training</button>
 <button class="navbtn" data-page="calendar"><span class="ico">▦</span>Plan</button>
 <button class="navbtn" data-page="progressPage"><span class="ico">↗</span>Fortschritt</button>
 <button class="navbtn" data-page="coach"><span class="ico">✦</span>Coach</button>
</div></nav>
<div id="finishModal" class="modal"><div class="sheet"><div class="title">Training abschließen</div><label style="margin-top:10px">Notiz</label><textarea id="sessionNote"></textarea><div class="grid2" style="margin-top:10px"><button class="secondary" onclick="closeFinish()">Abbrechen</button><button class="primary" onclick="finishWorkout()">Speichern</button></div></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
const fmt=(d,opt={weekday:"short",day:"2-digit",month:"2-digit"})=>new Intl.DateTimeFormat("de-DE",opt).format(new Date(d));
const read=(k,fallback)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fallback}catch{return fallback}};
const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const privateConfig=()=>read("pf_private_config",null);
let workouts=read("pf_workouts",null)||privateConfig()?.workouts||{};
const saveWorkouts=()=>write("pf_workouts",workouts);
const keys=()=>Object.keys(workouts||{});
const histories=()=>read("pf_history",[]);
const saveHist=v=>write("pf_history",v);
const cardioHist=()=>read("pf_cardio",[]);
const saveCardio=v=>write("pf_cardio",v);
const bodyHist=()=>read("pf_body",[]);
const saveBody=v=>write("pf_body",v);
const dailyLogs=()=>read("pf_daily_logs",{});
const saveDailyLogs=v=>write("pf_daily_logs",v);
const readiness=()=>read("pf_readiness",{sleep:7,energy:3,soreness:2,stress:2});
const saveReadiness=v=>write("pf_readiness",v);
const vacations=()=>read("pf_vacations",[]);
const saveVacations=v=>write("pf_vacations",v);
const mobilityLog=()=>read("pf_mobility",{});
const saveMobility=v=>write("pf_mobility",v);
const restSeconds=()=>+localStorage.getItem("pf_rest_seconds")||120;
const rules=()=>privateConfig()?.exerciseRules||{};
const defaultRule={sets:2,minReps:8,maxReps:12,rirMin:1,rirMax:3,rest:120,increment:2.5,primary:["Muskel"]};
const ruleFor=n=>rules()[n]||defaultRule;
const moves=[["Tiefe Hocke","60s"],["Couch Stretch","45s"],["Sprunggelenk","45s"],["90/90 Hüfte","60s"],["Lat Stretch","45s"],["Brust Stretch","45s"],["Schulter CARs","8×"],["Cat-Cow","10×"]];
function shiftCfg(){return privateConfig()?.shift||null}
function shift(d){const c=shiftCfg();if(!c?.cycle?.length||!c.anchor)return"F";const [y,m,day]=c.anchor.split("-").map(Number),a=new Date(y,m-1,day,12),x=new Date(d);x.setHours(12,0,0,0);const diff=Math.round((x-a)/86400000);return c.cycle[((diff%c.cycle.length)+c.cycle.length)%c.cycle.length]}
function isVacation(d){const k=iso(d);return vacations().some(v=>k>=v.start&&k<=v.end)}
function effectiveShift(d){return isVacation(d)?"U":shift(d)}
function shiftName(s){return s==="T"?"Tag":s==="N"?"Nacht":s==="U"?"Urlaub":"Frei"}
function splitType(n){n=(n||"").toLowerCase();if(n.includes("upper")||n.includes("ober"))return"upper";if(n.includes("lower")||n.includes("bein"))return"lower";return"other"}
function sequenceOrder(){const preferred=["Upper A","Lower A","Upper B","Lower B"].filter(x=>workouts[x]);return preferred.length?preferred:keys()}
function gymHistory(){return histories().filter(x=>keys().includes(x.name)).sort((a,b)=>new Date(a.date)-new Date(b.date))}
function nextGym(){const order=sequenceOrder();if(!order.length)return null;const h=gymHistory();if(!h.length)return order[0];const i=order.indexOf(h[h.length-1].name);return i>=0?order[(i+1)%order.length]:order[0]}
function lastTypeTime(type){const h=gymHistory().filter(x=>splitType(x.name)===type);return h.length?new Date(h[h.length-1].date).getTime():0}
function fatigue(){const r=readiness(),logs=dailyLogs();let bad=0;for(let i=0;i<5;i++){const d=new Date();d.setDate(d.getDate()-i);const x=logs[iso(d)];if(x&&((x.sleep||7)<6||(x.energy||3)<=2||(x.soreness||2)>=4))bad++}return{deload:bad>=3,bad}}
function buildPlan(days=28){
 const start=new Date();start.setHours(12,0,0,0);const order=sequenceOrder();let idx=Math.max(0,order.indexOf(nextGym()));if(idx<0)idx=0;
 const plannedLast={upper:lastTypeTime("upper"),lower:lastTypeTime("lower")};let zone=0,interval=0,strength=0;const out=[];
 for(let i=0;i<days;i++){
  const d=new Date(start);d.setDate(start.getDate()+i);const sh=effectiveShift(d),free=sh==="F"||sh==="U";
  let strengthName="",cardio="",mobility="10–15 min",note=sh==="N"?"Schlaf priorisieren":"";
  if(free&&order.length&&strength<4){
   const cand=order[idx%order.length],type=splitType(cand),last=plannedLast[type]||0,hours=(d.getTime()-last)/3600000;
   if(type==="other"||hours>=42){strengthName=cand;plannedLast[type]=d.getTime();idx++;strength++;note=fatigue().deload?"Deload: 50–70 % Volumen, 3–4 RIR":"Hypertrophie: meist 1–3 RIR"}
  }
  if(!strengthName){
   if(zone<2&&(free||sh==="T")){cardio=sh==="T"?"Zone 2 optional":"Zone 2";note=sh==="T"?"20–30 min locker, nur wenn frisch":"30–45 min locker";zone++}
   else if(!fatigue().deload&&interval<1&&free&&zone>=2&&i>=4){cardio="Intervalle optional";note="6×1–2 min hart / ca. 2 min locker";interval++}
   else if(sh==="N")note="Nachtschicht · Regeneration priorisieren";
  }else if(splitType(strengthName)==="upper"&&zone<2&&i>=2){
   cardio="Zone 2 optional";note+=" · optional danach 20–30 min Zone 2";zone++;
  }
  out.push({date:d,shift:sh,strength:strengthName,cardio,mobility,note});
 }
 return out
}
function planMap(){const m={};buildPlan(35).forEach(x=>m[iso(x.date)]=x);return m}
function todayPlan(){return planMap()[iso(new Date())]||{strength:"",cardio:"",mobility:"10–15 min",note:""}}
function todaysRecommendation(){const p=todayPlan();if(p.strength)return{main:p.strength,extra:p.note};if(p.cardio)return{main:p.cardio,extra:p.note};return{main:"Recovery / Mobility",extra:p.note||"10–15 min Mobility"}}
function getLog(k){const x=dailyLogs()[k]||{};return{sleep:x.sleep??"",quality:x.quality??3,energy:x.energy??3,soreness:x.soreness??2,stress:x.stress??2,rhr:x.rhr??"",steps:x.steps??"",water:x.water??"",load:x.dayLoad??3,note:x.eveningNote??"",morningDone:!!x.morningDone,eveningDone:!!x.eveningDone}}
let selectedLogDate=iso(new Date());
function recentDates(){const a=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);a.push(iso(d))}return a}
function mobilityFor(k=iso(new Date())){const l=mobilityLog();return l[k]||Array(moves.length).fill(false)}
function mobilityHtml(k=iso(new Date())){const a=mobilityFor(k);return `<div class="card"><div class="row"><div><div class="title">Mobility</div><div class="sub">${a.filter(Boolean).length}/${moves.length} erledigt</div></div><span class="badge">${a.filter(Boolean).length===moves.length?"✓ komplett":"heute"}</span></div>${moves.map((x,i)=>`<div class="mobRow"><button class="check ${a[i]?"on":""}" onclick="toggleMobility('${k}',${i})">${a[i]?"✓":""}</button><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div>`}
window.toggleMobility=(k,i)=>{const l=mobilityLog(),a=l[k]||Array(moves.length).fill(false);a[i]=!a[i];l[k]=a;saveMobility(l);renderHome();renderCoach()}
function renderHome(){
 try{
  const d=new Date(selectedLogDate+"T12:00:00"),isToday=selectedLogDate===iso(new Date()),t=getLog(selectedLogDate),rec=isToday?todaysRecommendation():{main:"Vergangener Tag",extra:"Einträge nachtragen oder korrigieren"},p=isToday?todayPlan():null;
  $("home").innerHTML=`<div class="card hero"><div class="row"><div class="sub">${fmt(d,{weekday:"long",day:"2-digit",month:"long"})}</div><span class="badge ${effectiveShift(d)}">${shiftName(effectiveShift(d))}</span></div><div class="big">${rec.main}</div><div class="sub">${rec.extra}</div>${isToday&&p?.strength?`<button class="primary" style="margin-top:12px" onclick="startWorkout('${p.strength}')">Training starten</button>`:""}${isToday&&p?.cardio?`<div class="good">❤️ Cardio: ${p.cardio} · ${p.note}</div>`:""}<div class="dayHistory">${recentDates().map(k=>`<button class="dayChip ${k===selectedLogDate?"active":""}" onclick="selectLog('${k}')">${fmt(new Date(k+"T12:00"),{weekday:"short",day:"2-digit"})}</button>`).join("")}</div></div>
  <div class="card"><div class="row"><div><div class="title">${isToday?"Morgen-Check-in":"Morgen nachtragen"}</div><div class="sub">${isToday?"nach dem Aufstehen":"für diesen Tag"}</div></div><span class="badge">${t.morningDone?"✓":"offen"}</span></div><div class="grid2"><div class="trackBox"><label>Schlaf h</label><input id="mSleep" value="${t.sleep}"></div><div class="trackBox"><label>Schlafqualität 1–5</label><input id="mQuality" value="${t.quality}"></div><div class="trackBox"><label>Energie 1–5</label><input id="mEnergy" value="${t.energy}"></div><div class="trackBox"><label>Muskelkater 1–5</label><input id="mSore" value="${t.soreness}"></div><div class="trackBox"><label>Stress 1–5</label><input id="mStress" value="${t.stress}"></div><div class="trackBox"><label>Ruhepuls</label><input id="mRhr" value="${t.rhr}"></div></div><button class="primary" style="margin-top:9px" onclick="saveMorning()">Speichern</button></div>
  <div class="card"><div class="row"><div><div class="title">${isToday?"Tagesabschluss":"Abend nachtragen"}</div><div class="sub">Schritte, Wasser & Belastung</div></div><span class="badge">${t.eveningDone?"✓":"offen"}</span></div><div class="grid2"><div class="trackBox"><label>Schritte</label><input id="eSteps" value="${t.steps}"></div><div class="trackBox"><label>Wasser L</label><input id="eWater" value="${t.water}"></div><div class="trackBox"><label>Tagesbelastung 1–5</label><input id="eLoad" value="${t.load}"></div><div class="trackBox"><label>Notiz</label><input id="eNote" value="${t.note}"></div></div><button class="secondary" style="margin-top:9px" onclick="saveEvening()">Speichern</button></div>
  ${isToday?mobilityHtml():""}`;
 }catch(e){$("home").innerHTML=`<div class="card alert"><b>Heute-Fehler:</b> ${e.message}</div>`}
}
window.selectLog=k=>{selectedLogDate=k;renderHome()}
window.saveMorning=()=>{const logs=dailyLogs(),k=selectedLogDate,old=logs[k]||{};logs[k]={...old,sleep:+$("mSleep").value||0,quality:+$("mQuality").value||3,energy:+$("mEnergy").value||3,soreness:+$("mSore").value||2,stress:+$("mStress").value||2,rhr:+$("mRhr").value||0,morningDone:true};saveDailyLogs(logs);if(k===iso(new Date()))saveReadiness({sleep:logs[k].sleep,energy:logs[k].energy,soreness:logs[k].soreness,stress:logs[k].stress});renderHome();renderCoach()}
window.saveEvening=()=>{const logs=dailyLogs(),k=selectedLogDate,old=logs[k]||{};logs[k]={...old,steps:+$("eSteps").value||0,water:+$("eWater").value||0,dayLoad:+$("eLoad").value||3,eveningNote:$("eNote").value||"",eveningDone:true};saveDailyLogs(logs);renderHome()}
let session=null,restUntil=0,restTimerId=null;
function newSession(name){return{name,start:Date.now(),exercises:(workouts[name]||[]).map(item=>{const n=Array.isArray(item)?item[0]:item.name,r=ruleFor(n);return{name:n,rule:r,sets:Array.from({length:r.sets||2},()=>({weight:"",reps:"",rir:String(r.rirMax||2),done:false}))}})}}
window.startWorkout=name=>{if(!workouts[name])return alert("Plan nicht gefunden.");session=newSession(name);showPage("workout")}
function lastSet(name){for(const h of [...histories()].reverse()){const e=h.exercises?.find(x=>x.name===name);const s=e?.sets?.filter(x=>x.done).slice(-1)[0];if(s)return s}return null}
function renderWorkout(){
 try{
  if(!session){$("workout").innerHTML=`<div class="card hero"><div class="row"><div><div class="title">Training</div><div class="sub">Starten, erstellen oder bearbeiten</div></div><button class="mini" onclick="createPlan()">+ Neu</button></div>${keys().map(k=>`<button class="planBtn" onclick="startWorkout('${k}')"><div class="row"><div><b>${k}</b><div class="sub">${workouts[k].length} Übungen</div></div><span>Start ›</span></div></button>`).join("")||`<div class="alert">Keine Trainingspläne geladen.</div>`}</div>${planEditorHtml()}`;return}
  const total=session.exercises.reduce((a,e)=>a+e.sets.length,0),done=session.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  $("workout").innerHTML=`<div class="card"><div class="row"><div><div class="sub">${session.name} · ${done}/${total} Sätze</div><div id="restTimer" class="timer">Bereit</div></div><div><button class="mini" onclick="addRest(30)">+30s</button> <button class="mini" onclick="liveAdd()">+ Übung</button></div></div><div class="progress"><span style="width:${total?done/total*100:0}%"></span></div></div>
  ${session.exercises.map((e,ei)=>{const prev=lastSet(e.name);return`<div class="exercise"><div class="exerciseHead"><div class="exerciseIcon">🏋️</div><div class="exerciseInfo"><div class="exName">${e.name}</div><div class="sub">${prev?`Zuletzt ${prev.weight||"–"} kg × ${prev.reps||"–"} · RIR ${prev.rir??"–"}`:`Ziel ${e.rule.minReps}–${e.rule.maxReps} Wdh. · RIR ${e.rule.rirMin}–${e.rule.rirMax}`}</div><div class="liveActions"><button class="mini" onclick="liveReplace(${ei})">Ersetzen</button><button class="mini" onclick="liveMove(${ei},-1)">↑</button><button class="mini" onclick="liveMove(${ei},1)">↓</button><button class="mini" onclick="liveRemove(${ei})">Entfernen</button></div></div></div><div class="setHead"><span>#</span><span>kg</span><span>Wdh.</span><span>RIR</span><span></span></div>${e.sets.map((s,si)=>`<div class="setRow"><span>${si+1}</span><input inputmode="decimal" value="${s.weight}" oninput="editSet(${ei},${si},'weight',this.value)"><input inputmode="numeric" value="${s.reps}" oninput="editSet(${ei},${si},'reps',this.value)"><select onchange="editSet(${ei},${si},'rir',this.value)">${["0","1","2","3","4+"].map(v=>`<option ${String(s.rir)===v?"selected":""}>${v}</option>`).join("")}</select><button class="doneBtn ${s.done?"on":""}" onclick="toggleSet(${ei},${si})">${s.done?"✓":"○"}</button></div>`).join("")}<div class="liveActions"><button class="mini" onclick="addSet(${ei})">+ Satz</button>${e.sets.length>1?`<button class="mini" onclick="removeSet(${ei})">− Satz</button>`:""}</div></div>`}).join("")}<button class="primary" onclick="openFinish()">Training abschließen</button>`;updateRest()
 }catch(e){$("workout").innerHTML=`<div class="card alert"><b>Training-Fehler:</b> ${e.message}</div>`}
}
function planEditorHtml(){return`<div class="card"><div class="title">Trainingspläne bearbeiten</div>${keys().map(k=>`<div class="editCard"><div class="row"><b>${k}</b><span><button class="mini" onclick="renamePlan('${k}')">Name</button> <button class="mini" onclick="deletePlan('${k}')">Löschen</button></span></div>${workouts[k].map((it,i)=>{const n=Array.isArray(it)?it[0]:it.name;return`<div class="metric"><span>${n}</span><span><button class="mini" onclick="movePlanEx('${k}',${i},-1)">↑</button> <button class="mini" onclick="movePlanEx('${k}',${i},1)">↓</button> <button class="mini" onclick="removePlanEx('${k}',${i})">×</button></span></div>`}).join("")}<button class="secondary" onclick="addPlanEx('${k}')">+ Übung</button></div>`).join("")}</div>`}
window.createPlan=()=>{const n=prompt("Name des neuen Plans:");if(n&&!workouts[n]){workouts[n]=[];saveWorkouts();renderWorkout()}}
window.renamePlan=o=>{const n=prompt("Neuer Name:",o);if(n&&n!==o&&!workouts[n]){workouts[n]=workouts[o];delete workouts[o];saveWorkouts();renderWorkout()}}
window.deletePlan=n=>{if(confirm(`"${n}" löschen?`)){delete workouts[n];saveWorkouts();renderWorkout()}}
window.addPlanEx=p=>{const n=prompt("Übung:");if(n){workouts[p].push([n,""]);saveWorkouts();renderWorkout()}}
window.removePlanEx=(p,i)=>{workouts[p].splice(i,1);saveWorkouts();renderWorkout()}
window.movePlanEx=(p,i,d)=>{const j=i+d;if(j<0||j>=workouts[p].length)return;[workouts[p][i],workouts[p][j]]=[workouts[p][j],workouts[p][i]];saveWorkouts();renderWorkout()}
window.liveAdd=()=>{const n=prompt("Übung hinzufügen:");if(!n)return;const r=ruleFor(n);session.exercises.push({name:n,rule:r,sets:Array.from({length:r.sets||2},()=>({weight:"",reps:"",rir:String(r.rirMax||2),done:false}))});renderWorkout()}
window.liveReplace=i=>{const n=prompt("Ersetzen durch:",session.exercises[i].name);if(!n)return;const r=ruleFor(n);session.exercises[i]={name:n,rule:r,sets:Array.from({length:r.sets||2},()=>({weight:"",reps:"",rir:String(r.rirMax||2),done:false}))};renderWorkout()}
window.liveRemove=i=>{if(confirm("Übung entfernen?")){session.exercises.splice(i,1);renderWorkout()}}
window.liveMove=(i,d)=>{const j=i+d;if(j<0||j>=session.exercises.length)return;[session.exercises[i],session.exercises[j]]=[session.exercises[j],session.exercises[i]];renderWorkout()}
window.editSet=(ei,si,k,v)=>session.exercises[ei].sets[si][k]=v;
window.toggleSet=(ei,si)=>{const s=session.exercises[ei].sets[si];s.done=!s.done;if(s.done){restUntil=Date.now()+restSeconds()*1000;startRest()}renderWorkout()}
window.addSet=ei=>{session.exercises[ei].sets.push({weight:"",reps:"",rir:"2",done:false});renderWorkout()}
window.removeSet=ei=>{session.exercises[ei].sets.pop();renderWorkout()}
window.addRest=s=>{restUntil=Math.max(Date.now(),restUntil)+s*1000;startRest()}
function startRest(){clearInterval(restTimerId);restTimerId=setInterval(updateRest,500);updateRest()}
function updateRest(){const el=$("restTimer");if(!el)return;const left=Math.max(0,Math.ceil((restUntil-Date.now())/1000));el.textContent=left?`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`:"Bereit";if(!left)clearInterval(restTimerId)}
window.openFinish=()=>$("finishModal").classList.add("open");window.closeFinish=()=>$("finishModal").classList.remove("open");
window.finishWorkout=()=>{const h=histories(),volume=session.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+(+s.weight||0)*(+s.reps||0),0),0);h.push({name:session.name,date:new Date().toISOString(),volume,note:$("sessionNote").value,exercises:session.exercises});saveHist(h);session=null;$("sessionNote").value="";closeFinish();showPage("progressPage")}
let calendarBase=new Date(),selectedDate=new Date();
function renderCalendar(){
 try{
  const y=calendarBase.getFullYear(),m=calendarBase.getMonth(),first=new Date(y,m,1,12),last=new Date(y,m+1,0,12),lead=(first.getDay()+6)%7,map=planMap();let cells="";
  for(let i=0;i<lead;i++)cells+="<div></div>";
  for(let n=1;n<=last.getDate();n++){const d=new Date(y,m,n,12),p=map[iso(d)];cells+=`<div class="day ${iso(d)===iso(selectedDate)?"sel":""}" onclick="pickDate(${y},${m},${n})"><div class="dayNum">${n}</div><span class="tiny">${shiftName(effectiveShift(d))}</span>${p?.strength?`<span class="tiny strength">🏋 ${p.strength}</span>`:""}${p?.cardio?`<span class="tiny cardio">♥ ${p.cardio}</span>`:""}${p?`<span class="tiny mobility">↔ Mobility</span>`:""}</div>`}
  const p=map[iso(selectedDate)]||{strength:"",cardio:"",mobility:"",note:""};
  $("calendar").innerHTML=`<div class="card"><div class="calendarHeader"><button class="mini" onclick="moveMonth(-1)">‹</button><div class="title">${fmt(calendarBase,{month:"long",year:"numeric"})}</div><button class="mini" onclick="moveMonth(1)">›</button></div><div class="calGrid">${["Mo","Di","Mi","Do","Fr","Sa","So"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div></div><div class="card"><div class="title">${fmt(selectedDate,{weekday:"long",day:"2-digit",month:"long"})}</div><div class="metric"><span>Kraft</span><strong>${p.strength||"—"}</strong></div><div class="metric"><span>Cardio</span><strong>${p.cardio||"—"}</strong></div><div class="metric"><span>Mobility</span><strong>${p.mobility||"—"}</strong></div><div class="good">${p.note||"Regeneration nach Bedarf"}</div></div><div class="card"><div class="title">Urlaub eintragen</div><div class="grid2"><div><label>Von</label><input id="vacStart" type="date"></div><div><label>Bis</label><input id="vacEnd" type="date"></div></div><button class="secondary" style="margin-top:8px" onclick="addVacation()">Urlaub speichern</button>${vacations().map((v,i)=>`<div class="metric"><span>${v.start} – ${v.end}</span><button class="mini" onclick="deleteVacation(${i})">Löschen</button></div>`).join("")}</div>`
 }catch(e){$("calendar").innerHTML=`<div class="card alert"><b>Plan-Fehler:</b> ${e.message}</div>`}
}
window.moveMonth=d=>{calendarBase=new Date(calendarBase.getFullYear(),calendarBase.getMonth()+d,1,12);renderCalendar()}
window.pickDate=(y,m,d)=>{selectedDate=new Date(y,m,d,12);renderCalendar()}
window.addVacation=()=>{const a=$("vacStart").value,b=$("vacEnd").value;if(!a||!b)return alert("Datum wählen.");const v=vacations();v.push({start:a<=b?a:b,end:a<=b?b:a});saveVacations(v);renderCalendar();renderHome();renderCoach()}
window.deleteVacation=i=>{const v=vacations();v.splice(i,1);saveVacations(v);renderCalendar();renderHome();renderCoach()}

function cardioFields(type){
 if(type==="Stairmaster"){
   return `<div class="grid2"><div class="trackBox"><label>Zeit (Minuten)</label><input id="cardioMinutes" inputmode="numeric" placeholder="z. B. 30"></div><div class="trackBox"><label>Stockwerke / Stufen</label><input id="cardioFloors" inputmode="numeric" placeholder="z. B. 120"></div></div>`;
 }
 if(["Marsch","Joggen","Laufen","Wandern"].includes(type)){
   return `<div class="grid2"><div class="trackBox"><label>Zeit (Minuten)</label><input id="cardioMinutes" inputmode="numeric" placeholder="z. B. 45"></div><div class="trackBox"><label>Entfernung (km)</label><input id="cardioDistance" inputmode="decimal" placeholder="z. B. 6.5"></div></div>`;
 }
 return `<div class="trackBox"><label>Zeit (Minuten)</label><input id="cardioMinutes" inputmode="numeric" placeholder="z. B. 35"></div>`;
}
function formatPace(minutes,distance){
 if(!minutes||!distance)return "";
 const pace=minutes/distance,whole=Math.floor(pace),sec=Math.round((pace-whole)*60);
 const s=sec===60?0:sec,m=sec===60?whole+1:whole;
 return `${m}:${String(s).padStart(2,"0")} min/km`;
}
function cardioDetails(x){
 const bits=[];
 if(x.minutes)bits.push(`${x.minutes} min`);
 if(x.distance)bits.push(`${x.distance} km`);
 if(x.floors)bits.push(`${x.floors} Stockwerke/Stufen`);
 if(x.distance&&x.minutes)bits.push(formatPace(+x.minutes,+x.distance));
 if(x.floors&&x.minutes)bits.push(`${(+x.floors/+x.minutes).toFixed(1)} / min`);
 return bits.join(" · ");
}
window.updateCardioFields=()=>{
 const type=$("cardioType")?.value||"Zone 2",box=$("cardioDynamic");
 if(box)box.innerHTML=cardioFields(type);
}

function renderProgress(){
 const h=histories().slice().reverse(),b=bodyHist(),c=cardioHist().slice().reverse();
 $("progressPage").innerHTML=`<div class="card hero"><div class="title">Fortschritt</div><div class="sub">Training, Gewicht und Cardio</div></div><div class="card"><div class="title">Körpergewicht</div><div class="grid2"><input id="bodyWeight" inputmode="decimal" placeholder="kg"><button class="secondary" onclick="addWeight()">Speichern</button></div>${b.slice(-5).reverse().map(x=>`<div class="metric"><span>${x.date}</span><strong>${x.weight} kg</strong></div>`).join("")}</div><div class="card"><div class="title">Cardio eintragen</div><div class="sub">Je nach Cardio-Art werden passende Werte abgefragt.</div><label style="margin-top:10px">Art</label><select id="cardioType" onchange="updateCardioFields()"><option>Zone 2</option><option>Intervalle</option><option>Stairmaster</option><option>Marsch</option><option>Joggen</option><option>Laufen</option><option>Wandern</option></select><div id="cardioDynamic" style="margin-top:8px">${cardioFields("Zone 2")}</div><button class="secondary" style="margin-top:8px" onclick="addCardio()">Speichern</button>${c.slice(0,8).map(x=>`<div class="metric"><span>${x.date}<div class="sub">${x.type}</div></span><strong>${cardioDetails(x)||`${x.minutes||"–"} min`}</strong></div>`).join("")}</div><div class="card"><div class="title">Trainingstagebuch</div>${h.slice(0,10).map(x=>`<div class="metric"><span>${x.name}<div class="sub">${fmt(x.date,{day:"2-digit",month:"2-digit",year:"2-digit"})}</div></span><strong>${Math.round(x.volume||0)} kg</strong></div>`).join("")||`<div class="sub">Noch keine Einheiten.</div>`}</div>`
}
window.addWeight=()=>{const w=+$("bodyWeight").value;if(!w)return;const b=bodyHist();b.push({date:iso(new Date()),weight:w});saveBody(b);renderProgress()}
window.addCardio=()=>{
 const type=$("cardioType").value,min=+$("cardioMinutes")?.value||0;
 if(!min)return alert("Bitte die Zeit eintragen.");
 const entry={date:iso(new Date()),type,minutes:min};
 if(type==="Stairmaster"){
   const floors=+$("cardioFloors")?.value||0;
   if(!floors)return alert("Bitte Stockwerke/Stufen eintragen.");
   entry.floors=floors;
 }else if(["Marsch","Joggen","Laufen","Wandern"].includes(type)){
   const distance=+$("cardioDistance")?.value||0;
   if(!distance)return alert("Bitte die Entfernung in km eintragen.");
   entry.distance=distance;
   entry.pace=formatPace(min,distance);
 }
 const c=cardioHist();c.push(entry);saveCardio(c);renderProgress();
}
function coachScore(){const last28=new Date();last28.setDate(last28.getDate()-28);const gym=gymHistory().filter(x=>new Date(x.date)>=last28).length,cardio=cardioHist().filter(x=>new Date(x.date)>=last28).length,r=readiness(),mob=mobilityFor().filter(Boolean).length;return{training:Math.min(100,Math.round(gym/16*100)),cardio:Math.min(100,Math.round(cardio/8*100)),recovery:Math.max(0,Math.min(100,Math.round((r.sleep/8*40)+(r.energy/5*25)+((6-r.soreness)/5*20)+((6-r.stress)/5*15)))),mobility:Math.round(mob/moves.length*100)}}
function renderCoach(){
 try{
  const week=buildPlan(7),s=coachScore(),r=fatigue(),next=nextGym();
  $("coach").innerHTML=`<div class="card hero"><div class="row"><div><div class="title">Adaptive Coach</div><div class="sub">Eine gemeinsame Planung für Heute, Kalender und Coach.</div></div><span class="badge">${r.deload?"Deload":"bereit"}</span></div><div class="${r.deload?"alert":"good"}">${r.deload?"Mehrere schwache Recovery-Tage: Volumen reduzieren und keine harten Intervalle.":`${next||"Training"} ist die nächste Einheit in deiner Reihenfolge.`}</div></div><div class="card"><div class="title">Nächste 7 Tage</div>${week.map(x=>`<div class="metric"><span><b>${fmt(x.date,{weekday:"short",day:"2-digit",month:"2-digit"})}</b><div class="sub">${shiftName(x.shift)} · ${x.note}</div></span><strong>${[x.strength,x.cardio].filter(Boolean).join(" + ")||"Recovery"}</strong></div>`).join("")}</div><div class="card"><div class="title">Cardio diese Woche</div>${week.filter(x=>x.cardio).map(x=>`<div class="metric"><span>${fmt(x.date,{weekday:"short",day:"2-digit"})}<div class="sub">${x.note}</div></span><strong>${x.cardio}</strong></div>`).join("")||`<div class="sub">Kein separates Cardio eingeplant.</div>`}</div><div class="card"><div class="title">Status</div><div class="scoreGrid"><div class="score"><b>${s.training}</b><span>Trainingskonstanz</span></div><div class="score"><b>${s.cardio}</b><span>Cardio</span></div><div class="score"><b>${s.recovery}</b><span>Recovery</span></div><div class="score"><b>${s.mobility}</b><span>Mobility heute</span></div></div></div>${mobilityHtml()}<div class="card"><div class="title">Einstellungen & Daten</div><button class="primary" onclick="importPrivateSetup()">🔐 Privates Setup importieren</button><button class="secondary" style="margin-top:8px" onclick="exportData()">Backup exportieren</button><button class="secondary" style="margin-top:8px" onclick="importData()">Backup importieren</button><label style="margin-top:10px">Pausentimer Sekunden</label><input id="restSetting" value="${restSeconds()}" inputmode="numeric"><button class="secondary" style="margin-top:8px" onclick="saveRest()">Speichern</button></div>`
 }catch(e){$("coach").innerHTML=`<div class="card alert"><b>Coach-Fehler:</b> ${e.message}</div>`}
}
window.saveRest=()=>{localStorage.setItem("pf_rest_seconds",String(+$("restSetting").value||120));renderCoach()}
window.importPrivateSetup=()=>{const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.workouts||!d.shift)throw Error("Ungültiges Setup");write("pf_private_config",d);workouts=d.workouts;saveWorkouts();$("setup").classList.remove("show");renderAll()}catch(e){alert(e.message)}};r.readAsText(i.files[0])};i.click()}
function exportData(){const data={version:11,privateConfig:privateConfig(),workouts,histories:histories(),cardio:cardioHist(),body:bodyHist(),dailyLogs:dailyLogs(),vacations:vacations(),mobility:mobilityLog(),readiness:readiness()};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`peak-fitness-backup-${iso(new Date())}.json`;a.click();URL.revokeObjectURL(a.href)}
window.importData=()=>{const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.privateConfig)write("pf_private_config",d.privateConfig);if(d.workouts){workouts=d.workouts;saveWorkouts()}if(d.histories)saveHist(d.histories);if(d.cardio)saveCardio(d.cardio);if(d.body)saveBody(d.body);if(d.dailyLogs)saveDailyLogs(d.dailyLogs);if(d.vacations)saveVacations(d.vacations);if(d.mobility)saveMobility(d.mobility);if(d.readiness)saveReadiness(d.readiness);renderAll()}catch(e){alert("Import fehlgeschlagen")}};r.readAsText(i.files[0])};i.click()}
function showPage(id){document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".navbtn").forEach(x=>x.classList.toggle("active",x.dataset.page===id));if(id==="home")renderHome();if(id==="workout")renderWorkout();if(id==="calendar")renderCalendar();if(id==="progressPage")renderProgress();if(id==="coach")renderCoach();scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>showPage(b.dataset.page));
function renderAll(){renderHome();renderWorkout();renderCalendar();renderProgress();renderCoach()}
function selfTest(){
 const results=[];const ok=(name,fn)=>{try{fn();results.push("PASS "+name)}catch(e){results.push("FAIL "+name+": "+e.message)}};
 if(!privateConfig()){const test={workouts:{"Upper A":[["Press",""]],"Lower A":[["Squat",""]],"Upper B":[["Row",""]],"Lower B":[["RDL",""]]},shift:{anchor:iso(new Date()),cycle:["F","F","F","F","F","F","F"]},exerciseRules:{}};write("pf_private_config",test);workouts=test.workouts;saveWorkouts()}
 ok("plan build",()=>{if(buildPlan(7).length!==7)throw Error("wrong length")});
 ok("home render",()=>{renderHome();if(!$("home").textContent.trim())throw Error("empty")});
 ok("coach render",()=>{renderCoach();if(!$("coach").textContent.trim())throw Error("empty")});
 ok("calendar render",()=>{renderCalendar();if(!$("calendar").textContent.trim())throw Error("empty")});
 ok("workout list",()=>{session=null;renderWorkout();if(!$("workout").textContent.includes("Training"))throw Error("missing")});
 ok("workout start",()=>{startWorkout(keys()[0]);renderWorkout();if(!session||!$("workout").textContent.includes(keys()[0]))throw Error("not started");session=null});
 ok("live editor",()=>{session=newSession(keys()[0]);const before=session.exercises.length;const r=ruleFor("Test");session.exercises.push({name:"Test",rule:r,sets:[{weight:"",reps:"",rir:"2",done:false}]});if(session.exercises.length!==before+1)throw Error("add failed");session=null});
 ok("vacation",()=>{const v=vacations();saveVacations([...v,{start:"2099-01-01",end:"2099-01-02"}]);if(!isVacation(new Date("2099-01-01T12:00")))throw Error("not detected");saveVacations(v)});
 const pre=document.createElement("pre");pre.id="selftest";pre.textContent=results.join("\n");pre.style="white-space:pre-wrap;padding:20px;color:white;background:#111";document.body.innerHTML="";document.body.appendChild(pre);document.title=results.some(x=>x.startsWith("FAIL"))?"SELFTEST FAIL":"SELFTEST PASS";
}
if("serviceWorker"in navigator&&!location.search.includes("selftest"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(location.search.includes("selftest"))selfTest();else{if(!privateConfig())$("setup").classList.add("show");renderAll()}
</script>
